server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS do Docker: resolve "api" de novo a cada 10 s. Sem isso o nginx guarda o IP do container
  # da API e responde 502 quando ela é recriada com outro IP (num deploy, por exemplo).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3333;

  # /api/* → API sem o prefixo (mesmo contrato do proxy do Vite em dev)
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # SPA: rotas do React Router caem no index.html
  location / {
    try_files $uri /index.html;
  }
}

# Produção: sobrepõe o docker-compose.yml (o de desenvolvimento continua igual).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Só o Caddy fica exposto (80/443, com HTTPS automático); banco e API ficam na rede interna.
# Variáveis obrigatórias no .env: DOMINIO, POSTGRES_PASSWORD, API_TOKEN, TELEGRAM_BOT_TOKEN.

x-producao: &producao
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    <<: *producao
    environment:
      # só vale na criação do volume; para trocar depois, use ALTER USER no banco
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}'
    ports: !reset []

  api:
    <<: *producao
    environment:
      # senha só com letras e números (ex.: openssl rand -hex 24), porque vai na URL
      DATABASE_URL: 'postgres://giro:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/giro'
      API_TOKEN: '${API_TOKEN:?defina API_TOKEN no .env (openssl rand -hex 32)}'
      JOBS_ENABLED: '${JOBS_ENABLED:-true}'
    ports: !reset []

  web:
    <<: *producao
    ports: !reset []

  caddy:
    <<: *producao
    image: caddy:2-alpine
    environment:
      DOMINIO: '${DOMINIO:?defina DOMINIO no .env (ex.: giro.seudominio.com.br)}'
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
